
name: Build Forward Daily APK

on:
  workflow_dispatch:
  push:
    paths:
      - "ForwardDailyLiveWallpaper.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Build the APK
        run: |
          unzip -q ForwardDailyLiveWallpaper.zip -d project
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          /tmp/gradle-8.9/bin/gradle -p project :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Forward-Daily-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
